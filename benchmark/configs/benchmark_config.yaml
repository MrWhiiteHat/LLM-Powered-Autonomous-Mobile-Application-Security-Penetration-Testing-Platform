# MSA v2.0 Benchmark & Evaluation Framework Configuration
experiment:
  name: "MSA Comprehensive Mobile Security Benchmark"
  msa_version: "2.0.0"
  timestamp: "2026-09-26T01:30:00Z"
  random_seed: 42

environment:
  python_version: "3.14.0"
  fastapi_version: "0.109.0"
  platform: "Windows 11 Pro"
  llm_provider: "ollama"
  llm_model: "qwen2.5-coder:1.5b"
  rag_documents: 2075
  rag_sources: 9

datasets:
  droidbench:
    enabled: true
    version: "3.0"
    categories: ["Callbacks", "GeneralJava", "AndroidSpecific", "Native", "DynamicLoading", "ICC"]
    authorized_type: "BENCHMARK"
  ghera:
    enabled: true
    version: "1.0"
    categories: ["Crypto", "ICC", "Permission", "Storage", "System", "Web", "NonAPI"]
    authorized_type: "BENCHMARK"
  owapp:
    enabled: true
    version: "2024"
    authorized_type: "BENCHMARK"
  mastg:
    enabled: true
    version: "v2.1.0"
    categories: ["STORAGE", "CRYPTO", "AUTH", "NETWORK", "PLATFORM", "CODE", "RESILIENCE"]
    authorized_type: "BENCHMARK"
  diva:
    enabled: true
    package: "jakhar.aseem.diva"
    authorized_type: "AUTHORIZED"
  androgoat:
    enabled: true
    package: "owasp.sat.agoat"
    authorized_type: "AUTHORIZED"
  insecurebankv2:
    enabled: true
    package: "com.android.insecurebankv2"
    authorized_type: "AUTHORIZED"
  ovaa:
    enabled: true
    package: "oversecured.ovaa"
    authorized_type: "AUTHORIZED"
  mitre_uploaddataapp:
    enabled: true
    package: "org.mitre.uploaddataapp"
    authorized_type: "BENCHMARK"
  iccbench:
    enabled: true
    authorized_type: "BENCHMARK"
  ubcbench:
    enabled: true
    authorized_type: "BENCHMARK"
  androzoo:
    enabled: true
    target_count: 50
    authorized_type: "RESEARCH_DATASET"

real_world:
  enabled: true
  target_count: 25
  authorized_type: "RESEARCH_DATASET"
  corpus_directory: "Android App"

dynamic_analysis:
  enabled: true
  authorized_targets_only: true
  timeout_seconds: 30
  hooks:
    - "Cipher.init"
    - "setHostnameVerifier"
    - "rawQuery"
    - "WebView.loadUrl"
    - "putString"
    - "File.<init>"
    - "Log.*"

ablation:
  enabled: true
  modes:
    - "static_only"
    - "no_rag"
    - "bm25_only"
    - "tfidf_only"
    - "bm25_tfidf"
    - "bm25_tfidf_rrf"
    - "full_rag"
    - "full_pipeline"

comparison:
  mobsf:
    enabled: true
    version: "4.4.0"
